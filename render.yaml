# render.yaml - Render deployment configuration for MeterFlow backend
# pyproject.toml is in backend/ directory

services:
  - type: web
    name: meterflow-backend
    env: python
    plan: free
    # Build from backend/ directory which contains pyproject.toml
    buildCommand: |
      cd backend && pip install -e .[dev]
      cd backend && alembic upgrade head
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port     healthCheckPath: /api/v1/health
    autoDeploy: true
    timeout: 15m
    envVars:
      RAZORPAY_KEY_ID:
        generate: false
      RAZORPAY_KEY_SECRET:
        generate: false
      RAZORPAY_WEBHOOK_SECRET:
        generate: false
      SUPABASE_URL:
        generate: false
      SUPABASE_ANON_KEY:
        generate: false
      SECRET_KEY:
        generate: true
      APP_ENV:
        generate: false
        value: production
