name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run type check
        run: ruff check --select "mypy" . 2>/dev/null || echo "mypy skipped"

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meterflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Set test environment
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/meterflow_test" > .env.test
          echo "SUPABASE_URL=http://localhost:54321" >> .env.test
          echo "SUPABASE_ANON_KEY=test-anon-key" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=test-service-role-key" >> .env.test
          echo "SUPABASE_JWT_SECRET=test-jwt-secret" >> .env.test
          echo "SECRET_KEY=test-secret-key-min-32-chars-long" >> .env.test
          echo "APP_ENV=test" >> .env.test

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meterflow_test

      - name: Run tests
        run: pytest -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/meterflow_test
          .env.test: .env.test

  # Optional: Docker build verification
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: false  # Enable when Dockerfiles are added
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t meterflow-backend ./backend
      - name: Build frontend image
        run: docker build -t meterflow-frontend ./frontend